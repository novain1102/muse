<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Muse — Your AI DJ</title>
<meta name="description" content="Muse builds a DJ set from your vibe and mixes it live in the browser: beat-matched blends, EQ and effects." />
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%23000' stroke='%2300ff9c' stroke-width='6'/><circle cx='32' cy='32' r='6' fill='%2300ff9c'/></svg>" />
</head>
<body>
<div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="grid"></div></div>

<header class="top glass">
  <div class="brand"><span class="logo"></span><b>Muse</b><small>Your AI DJ</small></div>
  <div class="topr">
    <div class="status" aria-live="polite"><span id="statusDot" class="dot"></span><span id="statusText">Ready</span></div>
    <button id="tourBtn" class="btn ghost round" type="button" title="Show the quick tour" aria-label="Show the quick tour">?</button>
  </div>
</header>

<main class="layout">
  <!-- LEFT: set builder -->
  <section class="panel glass gen">
    <h2>Build a set</h2>
    <input id="prompt" class="inp" type="text" placeholder="Describe a vibe (optional)" title="e.g. dark late-night techno · 深夜 暗黑 techno — Enter to generate" aria-label="Vibe" />

    <div class="sect" id="genreSect">
      <label class="lbl">Genre</label>
      <div id="genres" class="chips"></div>
    </div>
    <div class="sect" id="moodSect">
      <label class="lbl">Mood</label>
      <div id="moods" class="chips"></div>
    </div>

    <div class="grid2">
      <div>
        <label class="lbl" for="setLen">Length</label>
        <select id="setLen" class="inp">
          <option value="15">15 min</option>
          <option value="30" selected>30 min</option>
          <option value="45">45 min</option>
          <option value="60">60 min</option>
          <option value="90">90 min</option>
        </select>
      </div>
      <div>
        <label class="lbl" for="perTrack">Per track</label>
        <select id="perTrack" class="inp">
          <option value="90">1:30</option>
          <option value="150" selected>2:30</option>
          <option value="210">3:30</option>
          <option value="0">Full</option>
        </select>
      </div>
      <div>
        <label class="lbl" for="order">Order</label>
        <select id="order" class="inp" title="Arc: warm-up → peak → cool-down">
          <option value="arc" selected>Arc</option>
          <option value="build">Build-up</option>
          <option value="found">As found</option>
        </select>
      </div>
      <div>
        <label class="lbl" for="source">Source</label>
        <select id="source" class="inp" title="Where the music comes from"><!-- filled from the provider registry (providers/*.js) --></select>
      </div>
      <div>
        <label class="lbl" for="taste">Taste</label>
        <select id="taste" class="inp" title="How much your ♥ likes steer track picks">
          <option value="off">Off</option>
          <option value="some" selected>Some</option>
          <option value="strong">Strong</option>
        </select>
      </div>
      <div>
        <label class="lbl">Liked</label>
        <button id="likedBtn" class="btn likedbtn" type="button" title="Show liked tracks"><span class="hrt">♥</span> <b id="likedBtnCount">0</b></button>
      </div>
    </div>
    <button id="buildBtn" class="btn primary"><span class="pi">▶</span> Generate &amp; Play</button>
    <details class="ai">
      <summary>Advanced</summary>
      <label class="tog" title="Optional. Turns your vibe into a few extra search keywords with your own OpenAI API key (one short request per set, cached). The key stays in this browser."><input id="aiOn" type="checkbox" /><span>Keyword expansion</span></label>
      <input id="aiKey" class="inp" type="password" placeholder="OpenAI API key (sk-…)" autocomplete="off" />
      <input id="aiModel" class="inp" type="text" value="gpt-4o-mini" title="Model" />
      <label class="lbl" for="neteaseProxy" title="NetEase Cloud Music needs a small proxy you host yourself — see providers/proxy/README.md">NetEase proxy</label>
      <div class="inrow"><input id="neteaseProxy" class="inp" type="url" placeholder="https://your-proxy.workers.dev" autocomplete="off" /><button id="proxySave" class="btn mini" type="button">Save</button></div>
    </details>
  </section>

  <!-- CENTER: now playing, transport, FX, decks -->
  <section class="center">
    <div class="panel glass viz">
      <canvas id="viz"></canvas>
      <div class="now">
        <img id="nowArt" class="art" alt="" />
        <div class="meta">
          <div class="tag">Now playing</div>
          <div id="nowTitle" class="title">Nothing playing</div>
          <div id="nowArtist" class="artist">—</div>
          <div class="progress"><div id="nowBar"></div></div>
          <div class="times"><span id="nowTime">0:00</span><span id="nowInfo"></span><span id="nowLeft">0:00</span></div>
        </div>
        <div class="npacts">
          <button id="dislikeNow" class="dis big" type="button" disabled title="Play something first" aria-pressed="false"></button>
        <button id="likeNow" class="heart big" type="button" disabled title="Play something to like it" aria-pressed="false">♡</button>
        </div>
      </div>
      <div id="xfadeBadge" class="xbadge">MIXING</div>
      <div id="fxlog" class="fxlog"></div>
    </div>

    <div class="transport panel glass">
      <button id="prevBtn" class="btn icon" title="Restart track" aria-label="Restart track">⏮</button>
      <button id="playBtn" class="btn icon big" title="Play / Pause" aria-label="Play / Pause">▶</button>
      <button id="nextBtn" class="btn icon" title="Mix to next now" aria-label="Mix to next">⏭</button>
      <div class="xf" title="Crossfader (automatic)">
        <span>A</span><input id="xfader" type="range" min="0" max="1" step="0.001" value="0" disabled aria-label="Crossfader" /><span>B</span>
      </div>
      <div class="opts" title="Crossfade length">
        <span class="olbl">Fade <b id="xfLenVal">8s</b></span>
        <input id="xfLen" type="range" min="4" max="16" step="1" value="8" aria-label="Crossfade length" />
      </div>
      <div class="togs">
        <label class="tog" title="Automatic effects during mixes"><input id="autoFx" type="checkbox" checked /><span>Auto FX</span></label>
        <label class="tog" title="Match tempos when mixing"><input id="tempoSync" type="checkbox" checked /><span>Sync</span></label>
        <label class="tog" title="Start tracks after their intro"><input id="skipIntro" type="checkbox" checked /><span>Skip intros</span></label>
        <label class="tog" title="Keep adding tracks when the set ends"><input id="endless" type="checkbox" checked /><span>Endless</span></label>
        <select id="fxAmt" class="inp mini" title="Auto FX intensity" aria-label="Auto FX intensity">
          <option value="subtle">Subtle</option><option value="normal" selected>Normal</option><option value="wild">Wild</option>
        </select>
      </div>
    </div>

    <div class="pads panel glass">
      <div class="phead"><h2 title="Hold or tap a pad · keys 1–9, 0, N">Live FX</h2>
        <div class="padopts">
          <div id="beatSeg" class="seg" title="Effect length in beats">
            <button data-b="0.25">1/4</button><button data-b="0.5">1/2</button><button data-b="1" class="on">1</button><button data-b="2">2</button><button data-b="4">4</button>
          </div>
          <div id="targetSeg" class="seg" title="Which deck the pads affect"><button data-t="live" class="on">Live</button><button data-t="A">A</button><button data-t="B">B</button></div>
          <span id="bpmNow" class="muted">— BPM</span>
        </div>
      </div>
      <div id="padgrid" class="padgrid"></div>
    </div>

    <div class="decks">
      <div class="deck panel glass" id="deckA"></div>
      <div class="deck panel glass" id="deckB"></div>
    </div>
  </section>

  <!-- RIGHT: tracklist -->
  <section class="panel glass list" id="listPanel">
    <div class="lhead"><h2>Tracklist</h2><span id="listInfo" class="muted"></span></div>
    <div class="seg tabs"><button id="tabSet" class="on" type="button">Set</button><button id="tabLiked" type="button">♥ Liked <b id="likedCount">0</b></button><button id="tabDisliked" class="tabdis" type="button" title="Disliked tracks — never picked again"><i class="dico"></i> <b id="dislikedCount">0</b></button></div>
    <div class="setview">
      <div class="upnext"><span class="tag">Up next</span><span id="upNext">—</span></div>
      <ol id="tracklist" class="tracks"></ol>
    </div>
    <div class="likedview">
      <div class="likebar">
        <span id="tasteSummary" class="muted" title="Your taste profile"></span>
        <span class="likeacts"><button id="likesExport" class="btn mini" type="button" title="Download likes + dislikes as JSON">Export</button><button id="likesImport" class="btn mini" type="button" title="Merge likes + dislikes from a JSON file">Import</button></span>
        <input id="likesFile" type="file" accept="application/json,.json" hidden />
      </div>
      <ol id="likedList" class="tracks liked"></ol>
      <ol id="dislikedList" class="tracks liked disliked"></ol>
    </div>
    <div class="master" title="Master volume">
      <span class="olbl">Master</span>
      <input id="masterVol" type="range" min="0" max="1" step="0.01" value="0.85" aria-label="Master volume" />
    </div>
  </section>
</main>

<template id="deckTpl">
  <div class="deckHead"><span class="deckName"></span><span class="deckState">CUE</span><span class="deckTrack muted">empty</span><span class="deckBpm muted"></span></div>
  <div class="deckBody">
    <div class="knobs"></div>
    <div class="strip">
      <div class="meter" title="Level"><i class="lv"></i><i class="pk"></i></div>
      <div class="fader" title="Channel volume"><i class="fv"></i></div>
    </div>
  </div>
  <div class="deckFoot">
    <div class="pitch" title="Tempo / pitch"><span>PITCH</span><div class="pbar"><i></i></div><output class="pval">0.0%</output></div>
    <div class="lamps"><span data-fx="loop">LOOP</span><span data-fx="stutter">STUT</span><span data-fx="echo">ECHO</span><span data-fx="sweep">FILT</span><span data-fx="flanger">FLNG</span><span data-fx="phaser">PHSR</span><span data-fx="wash">VERB</span><span data-fx="brake">STOP</span></div>
  </div>
</template>

<!-- music providers: registry first, then each provider (registration order = Source menu order), then the app -->
<script src="providers/registry.js"></script>
<script src="providers/audius.js"></script>
<script src="providers/itunes.js"></script>
<script src="providers/cn-common.js"></script>
<script src="providers/kugou.js"></script>
<script src="providers/qqmusic.js"></script>
<script src="providers/netease.js"></script>
<script src="taste.js"></script>
<script src="app.js"></script>
<script src="tour.js"></script>
</body>
</html>
